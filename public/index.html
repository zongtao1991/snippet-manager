<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码片段管理工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>代码片段管理工具</h1>
      <button id="newBtn" class="btn btn-primary">新建片段</button>
    </header>

    <div class="search-filter">
      <input type="text" id="searchInput" placeholder="搜索标题或代码内容..." />
      <select id="languageFilter">
        <option value="all">所有语言</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="SQL">SQL</option>
        <option value="Bash">Bash</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div id="formContainer" class="form-container hidden">
      <div class="form-header">
        <h2 id="formTitle">新建代码片段</h2>
        <button id="closeForm" class="btn-close">&times;</button>
      </div>
      <form id="snippetForm">
        <input type="hidden" id="snippetId" />
        <div class="form-group">
          <label for="title">标题</label>
          <input type="text" id="title" name="title" required />
        </div>
        <div class="form-group">
          <label for="language">语言</label>
          <select id="language" name="language" required>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="SQL">SQL</option>
            <option value="Bash">Bash</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tags">标签（逗号分隔）</label>
          <input type="text" id="tags" name="tags" placeholder="例如：函数,工具,常用" />
        </div>
        <div class="form-group">
          <label for="content">代码内容</label>
          <textarea id="content" name="content" rows="15" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary">取消</button>
        </div>
      </form>
    </div>

    <div id="snippetList" class="snippet-list">
    </div>

    <div id="emptyState" class="empty-state">
      <p>暂无代码片段，点击「新建片段」开始添加</p>
    </div>

    <div id="deleteModal" class="modal hidden">
      <div class="modal-content">
        <p>确定要删除这个代码片段吗？</p>
        <div class="modal-actions">
          <button id="confirmDelete" class="btn btn-danger">删除</button>
          <button id="cancelDelete" class="btn btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
